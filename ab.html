<!DOCTYPE html>
<html>
<head>
  <title>Multiply</title>
</head>
<body>
<script>
    function multiply(a, b) {
        return a * b;
    }

    console.log(multiply(3, 4));

    let num1 = prompt("Enter first number");
    let num2 = prompt("Enter second number");

    num1 = Number(num1);
    num2 = Number(num2);
    let result = multiply(num1, num2);
    document.write("The result is " + result);
</script>
</body>
</html>

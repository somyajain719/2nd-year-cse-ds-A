<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard Events</title>

    <style>
        p,
        input {
            margin: 10px;
            font-size: 20px;
        }

        body {
            background-color: lightgreen;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #form {
            width: 400px;
            height: 500px;
            background-color: lightblue;
            text-align: center;
            font-size: 20px;
            margin: 50px auto;
            border: 2px solid black;
            border-radius: 10px;
            padding: 20px;
        }
    </style>
</head>

<body>

    <div id="form">

        <h1 id="h1">Keyboard Events</h1>

        <p>onkeydown</p>
        <input type="text" id="keydownInput"
            onkeydown="keydownEvent()">

        <p>onkeyup</p>
        <input type="text" id="keyupInput"
            onkeyup="keyupEvent()">

        <p>onkeypress</p>
        <input type="text" id="keypressInput"
            onkeypress="keypressEvent()">

    </div>

    <script>
        function keydownEvent() {
            console.log("Key Down");
        }

        function keyupEvent() {
            console.log("Key Up");
        }

        function keypressEvent() {
            console.log("Key Press");
        }
    </script>

</body>

</html>
